<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">PDF Livre — PDF to Markdown, offline</title>
<desc id="desc">An open-source initiative by Fiber Banda Larga Tecnologia da Informação. A PDF document becomes page-by-page Markdown on your device.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#143e57"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8cbede" stroke-opacity=".06"/></pattern></defs>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/><rect width="1280" height="400" rx="24" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="70" fill="#8ed7e5" font-size="14" font-weight="700" letter-spacing="3">FIBER · OPEN SOURCE</text><text x="60" y="166" fill="#f1f7fc" font-size="76" font-weight="700" letter-spacing="-3">PDF Livre</text><text x="64" y="216" fill="#c1d6e5" font-size="25">PDF → Markdown</text><rect x="64" y="250" width="114" height="35" rx="17" fill="#214d64"/><text x="121" y="273" fill="#b7f0db" font-size="13" font-weight="700" text-anchor="middle">OFFLINE</text><rect x="190" y="250" width="130" height="35" rx="17" fill="#214d64"/><text x="255" y="273" fill="#d7eaf6" font-size="13" font-weight="700" text-anchor="middle">LOCAL FIRST</text><rect x="332" y="250" width="100" height="35" rx="17" fill="#214d64"/><text x="382" y="273" fill="#d7eaf6" font-size="13" font-weight="700" text-anchor="middle">MIT</text><text x="64" y="352" fill="#94b2c8" font-size="16">Fiber Banda Larga Tecnologia da Informação</text></g>
<g transform="translate(775 72)"><rect width="164" height="226" rx="12" fill="#edf6fc"/><path d="M113 0v50h51" fill="#c3dce9"/><text x="22" y="83" font-family="Arial,sans-serif" font-size="22" fill="#1f5f8b" font-weight="700">PDF</text><path d="M24 113h116M24 132h116M24 151h90M24 186h102" stroke="#9eb9cc" stroke-width="7" stroke-linecap="round"/><circle cx="170" cy="160" r="24" fill="#6ed5c0"/><path d="M160 160h20m-8-8 8 8-8 8" fill="none" stroke="#123b43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(974 109)"><rect width="245" height="205" rx="12" fill="#0c1a2b" stroke="#426a81"/><circle cx="17" cy="17" r="4" fill="#72baa8"/><circle cx="31" cy="17" r="4" fill="#52788e"/><circle cx="45" cy="17" r="4" fill="#52788e"/><g font-family="monospace" font-size="15"><text x="18" y="62" fill="#88cde5">## Página 1</text><text x="18" y="91" fill="#b3c8d8">Texto em Markdown.</text><text x="18" y="136" fill="#88cde5">## Página 2</text><text x="18" y="165" fill="#b3c8d8">Page by page.</text></g></g>
</svg>
